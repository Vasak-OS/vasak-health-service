[package]
name = "vasak-health-daemon"
description = "Servicio de salud de VasakOS: tiempo de pantalla por aplicación"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "vasak-health-service"
path = "src/main.rs"

[dependencies]
vasak-health-protocol.workspace = true
serde.workspace = true
serde_json = "1"
zbus.workspace = true
tokio.workspace = true
chrono.workspace = true
# Los directorios base XDG: la regla de que una ruta relativa o vacía se ignora
# vive ahí y no en una copia acá.
dirs = "6"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
